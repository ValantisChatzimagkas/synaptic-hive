# docker-compose.yml
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: iot_timescaledb
    env_file:
      - .env.docker
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    networks:
      - iot_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot_user -d iot_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: iot_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - iot_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iot_api
    ports:
      - "8000:8000"
    env_file:
      - .env
      - .env.docker
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - iot_network

  measurement_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iot_measurement_worker
    command: uv run python -m app.workers.measurement_worker
    env_file:
      - .env
      - .env.docker
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - iot_network

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iot_celery_worker
    command: uv run celery -A app.celery_app.celery_app worker --loglevel=info
    env_file:
      - .env
      - .env.docker
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - iot_network

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iot_celery_beat
    command: uv run celery -A app.celery_app.celery_app beat --loglevel=info
    env_file:
      - .env
      - .env.docker
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - iot_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: iot_frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
      - ./frontend/.env.docker
    depends_on:
      api:
        condition: service_healthy
    networks:
      - iot_network

volumes:
  timescaledb_data:
  redis_data:

networks:
  iot_network:
    driver: bridge