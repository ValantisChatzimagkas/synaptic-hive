name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: iot_user
          POSTGRES_PASSWORD: iot_password
          POSTGRES_DB: iot_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iot_user -d iot_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://iot_user:iot_password@localhost:5432/iot_db
      REDIS_URL: redis://localhost:6379/0
    # CI runs `make check`, the same target as local, so the two can't drift.
    # Redis is faked in tests (fakeredis); only TimescaleDB is a real service.
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --locked
      - run: make check
